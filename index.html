<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown 阅读器</title>
<!-- 解析与高亮依赖（CDN） -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-light" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-dark" disabled />
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f8fa;
    --fg: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --border: #d0d7de;
    --code-bg: #f6f8fa;
    --code-fg: #1f2328;
    --quote-border: #d0d7de;
    --quote-fg: #656d76;
    --table-stripe: #f6f8fa;
    --shadow: 0 1px 3px rgba(27,31,36,.12);
    --toolbar-bg: rgba(255,255,255,.85);
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #4493f8;
    --accent-soft: #16305a;
    --border: #30363d;
    --code-bg: #161b22;
    --code-fg: #e6edf3;
    --quote-border: #30363d;
    --quote-fg: #8b949e;
    --table-stripe: #161b22;
    --shadow: 0 1px 3px rgba(0,0,0,.5);
    --toolbar-bg: rgba(13,17,23,.85);
  }
  [data-theme="sepia"] {
    --bg: #f7f1e3;
    --bg-soft: #efe6d3;
    --fg: #433422;
    --muted: #8a7a64;
    --accent: #9a5b34;
    --accent-soft: #ead9c4;
    --border: #d9cbb0;
    --code-bg: #efe6d3;
    --code-fg: #433422;
    --quote-border: #d9cbb0;
    --quote-fg: #8a7a64;
    --table-stripe: #efe6d3;
    --shadow: 0 1px 3px rgba(120,90,50,.18);
    --toolbar-bg: rgba(247,241,227,.85);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    transition: background .25s, color .25s;
  }

  /* ---------- 顶部工具栏 ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--toolbar-bg);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .toolbar .brand {
    font-weight: 700; font-size: 15px; margin-right: 4px;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .toolbar .brand .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #7ee787);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 800;
  }
  .spacer { flex: 1; }
  .btn {
    appearance: none; border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--fg);
    padding: 6px 12px; border-radius: 8px; font-size: 13px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ---------- 主体布局 ---------- */
  .layout { display: flex; height: calc(100vh - 53px); }
  .pane-editor {
    width: 42%; min-width: 280px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .pane-preview { flex: 1; overflow: auto; position: relative; }
  textarea#editor {
    flex: 1; width: 100%; border: 0; resize: none; outline: none;
    padding: 20px; font-family: "SFMono-Regular", Consolas, "Liberation Mono",
      Menlo, monospace; font-size: 14px; line-height: 1.6;
    background: var(--bg-soft); color: var(--fg); tab-size: 2;
  }
  .hidden { display: none !important; }

  /* ---------- 拖拽遮罩 ---------- */
  .drop-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(9,105,218,.12);
    border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .drop-overlay.show { display: flex; }
  .drop-overlay .inner {
    background: var(--bg); border: 1px solid var(--border);
    padding: 28px 40px; border-radius: 16px; text-align: center;
    box-shadow: var(--shadow); font-size: 18px; font-weight: 600;
  }

  /* ---------- 空状态 ---------- */
  .welcome {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; color: var(--muted); gap: 10px;
  }
  .welcome h2 { color: var(--fg); margin: 0; font-size: 22px; }
  .welcome .hint { font-size: 14px; line-height: 1.9; max-width: 460px; }
  .welcome kbd {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 7px; font-size: 12px; color: var(--fg);
  }

  /* ---------- Markdown 渲染样式 ---------- */
  .markdown-body {
    max-width: 820px; margin: 0 auto; padding: 40px 32px 80px;
    font-size: 16px; line-height: 1.75; word-wrap: break-word;
  }
  .markdown-body > *:first-child { margin-top: 0; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    margin: 1.6em 0 .6em; font-weight: 700; line-height: 1.3;
  }
  .markdown-body h1 { font-size: 1.9em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body h4 { font-size: 1.05em; }
  .markdown-body p { margin: .9em 0; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body img { max-width: 100%; border-radius: 8px; }
  .markdown-body ul, .markdown-body ol { padding-left: 1.6em; margin: .8em 0; }
  .markdown-body li { margin: .35em 0; }
  .markdown-body blockquote {
    margin: 1em 0; padding: .4em 1.1em; color: var(--quote-fg);
    border-left: 4px solid var(--quote-border); background: var(--bg-soft);
    border-radius: 0 8px 8px 0;
  }
  .markdown-body blockquote > *:first-child { margin-top: 0; }
  .markdown-body blockquote > *:last-child { margin-bottom: 0; }
  .markdown-body code {
    background: var(--code-bg); color: var(--code-fg);
    padding: .15em .4em; border-radius: 5px; font-size: .88em;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
  }
  .markdown-body pre {
    background: var(--code-bg); padding: 16px; border-radius: 10px;
    overflow: auto; border: 1px solid var(--border); margin: 1em 0;
  }
  .markdown-body pre code { background: none; padding: 0; font-size: .9em; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .markdown-body table {
    border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .95em;
    display: block; overflow: auto;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--border); padding: 8px 13px;
  }
  .markdown-body th { background: var(--bg-soft); font-weight: 700; }
  .markdown-body tr:nth-child(2n) td { background: var(--table-stripe); }
  .markdown-body input[type="checkbox"] { margin-right: 6px; }
  .markdown-body .task-list-item { list-style: none; margin-left: -1.4em; }
  .markdown-body kbd {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: .85em;
  }

  /* 移动端：上下堆叠 */
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .pane-editor { width: 100%; min-width: 0; height: 38%; border-right: 0; border-bottom: 1px solid var(--border); }
    .pane-preview { height: 62%; }
    .meta { display: none; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="brand"><span class="logo">M</span> Markdown 阅读器</div>
    <button class="btn" id="btn-open">打开文件</button>
    <button class="btn" id="btn-toggle-editor">隐藏编辑</button>
    <button class="btn" id="btn-theme">🌗 主题</button>
    <button class="btn" id="btn-copy">复制 MD</button>
    <button class="btn" id="btn-export">导出 HTML</button>
    <div class="spacer"></div>
    <span class="meta" id="meta">就绪</span>
    <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" class="hidden" />
  </div>

  <div class="layout">
    <div class="pane-editor" id="pane-editor">
      <textarea id="editor" placeholder="在此粘贴 Markdown 文字，或把 .md 文件拖进来…" spellcheck="false"></textarea>
    </div>
    <div class="pane-preview" id="pane-preview">
      <div class="welcome" id="welcome">
        <h2>把 Markdown 变成好读的文章 ✨</h2>
        <div class="hint">
          • <b>拖拽</b> 一个 <code>.md</code> / <code>.txt</code> 文件到这里<br/>
          • 直接 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 Markdown 文字<br/>
          • 点击左上角「打开文件」选择本地文件<br/>
          • 左侧编辑、右侧实时预览，自动保存
        </div>
      </div>
      <article class="markdown-body" id="preview"></article>
    </div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
    <div class="inner">📄 松开以加载 Markdown 文件</div>
  </div>

<script>
(function () {
  "use strict";

  const editor = document.getElementById("editor");
  const preview = document.getElementById("preview");
  const welcome = document.getElementById("welcome");
  const meta = document.getElementById("meta");
  const fileInput = document.getElementById("file-input");
  const dropOverlay = document.getElementById("drop-overlay");
  const paneEditor = document.getElementById("pane-editor");
  const STORAGE_KEY = "md-reader-content";

  // ---------- marked 配置 ----------
  marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });

  // ---------- 主题 ----------
  const themes = ["light", "dark", "sepia"];
  const hljsLight = document.getElementById("hljs-light");
  const hljsDark = document.getElementById("hljs-dark");
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    const isDark = theme === "dark";
    hljsDark.disabled = !isDark;
    hljsLight.disabled = isDark;
    try { localStorage.setItem("md-reader-theme", theme); } catch (e) {}
  }
  const savedTheme = (function () { try { return localStorage.getItem("md-reader-theme"); } catch (e) { return null; } })();
  applyTheme(savedTheme && themes.includes(savedTheme) ? savedTheme : "light");
  let themeIdx = themes.indexOf(document.documentElement.getAttribute("data-theme"));
  document.getElementById("btn-theme").addEventListener("click", function () {
    themeIdx = (themeIdx + 1) % themes.length;
    applyTheme(themes[themeIdx]);
  });

  // ---------- 渲染 ----------
  function render() {
    const raw = editor.value;
    if (raw.trim() === "") {
      preview.innerHTML = "";
      welcome.classList.remove("hidden");
      meta.textContent = "就绪";
      return;
    }
    welcome.classList.add("hidden");
    const dirty = marked.parse(raw);
    const clean = DOMPurify.sanitize(dirty);
    preview.innerHTML = clean;
    preview.querySelectorAll("pre code").forEach(function (block) {
      try { hljs.highlightElement(block); } catch (e) {}
    });
    // 统计
    const chars = raw.replace(/\s/g, "").length;
    const words = (raw.match(/[一-龥]/g) || []).length + (raw.trim().split(/\s+/).filter(Boolean).length);
    const minutes = Math.max(1, Math.round(words / 300));
    meta.textContent = chars + " 字符 · 约 " + minutes + " 分钟阅读";
    try { localStorage.setItem(STORAGE_KEY, raw); } catch (e) {}
  }

  // ---------- 编辑器输入（防抖） ----------
  let t;
  editor.addEventListener("input", function () { clearTimeout(t); t = setTimeout(render, 180); });

  // ---------- 文件读取 ----------
  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      editor.value = e.target.result;
      render();
      meta.textContent = "已加载：" + file.name;
    };
    reader.readAsText(file);
  }
  document.getElementById("btn-open").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function (e) { loadFile(e.target.files[0]); });

  // ---------- 拖拽 ----------
  let dragDepth = 0;
  window.addEventListener("dragenter", function (e) { e.preventDefault(); dragDepth++; dropOverlay.classList.add("show"); });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function (e) { e.preventDefault(); dragDepth--; if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove("show"); } });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; dropOverlay.classList.remove("show");
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) { loadFile(file); return; }
    // 拖入的是文本（如从别处拖来的文字）
    const text = e.dataTransfer.getData("text/plain");
    if (text) { editor.value = text; render(); }
  });

  // ---------- 全局粘贴：空内容时自动填充 ----------
  document.addEventListener("paste", function (e) {
    const active = document.activeElement;
    if (active === editor) return; // 已在编辑框里，交给 textarea 自己处理
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (text && text.indexOf("#") !== -1 || /[*_`>#-]/.test(text)) {
      // 看起来像 markdown
      e.preventDefault();
      editor.value = text;
      render();
      editor.focus();
    }
  });

  // ---------- 工具栏按钮 ----------
  document.getElementById("btn-toggle-editor").addEventListener("click", function () {
    const hidden = paneEditor.classList.toggle("hidden");
    this.textContent = hidden ? "显示编辑" : "隐藏编辑";
    if (hidden) welcome.classList.toggle("hidden", editor.value.trim() !== "");
  });
  document.getElementById("btn-copy").addEventListener("click", function () {
    const text = editor.value;
    if (!text) { meta.textContent = "没有可复制的内容"; return; }
    navigator.clipboard.writeText(text).then(function () {
      meta.textContent = "已复制 Markdown 源码";
    }).catch(function () { meta.textContent = "复制失败"; });
  });
  document.getElementById("btn-export").addEventListener("click", function () {
    if (!editor.value.trim()) { meta.textContent = "没有可导出的内容"; return; }
    const clean = DOMPurify.sanitize(marked.parse(editor.value));
    const doc = "<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'>" +
      "<meta name='viewport' content='width=device-width,initial-scale=1'>" +
      "<title>Markdown 导出</title><style>" +
      "body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;max-width:820px;margin:40px auto;padding:0 20px;line-height:1.75;color:#1f2328}" +
      "pre{background:#f6f8fa;padding:16px;border-radius:10px;overflow:auto}" +
      "code{background:#f6f8fa;padding:.15em .4em;border-radius:5px;font-size:.88em}" +
      "blockquote{border-left:4px solid #d0d7de;padding:.4em 1.1em;color:#656d76;background:#f6f8fa}" +
      "table{border-collapse:collapse;width:100%}th,td{border:1px solid #d0d7de;padding:8px 13px}" +
      "th{background:#f6f8fa}img{max-width:100%}a{color:#0969da}" +
      "</style></head><body>" + clean + "</body></html>";
    const blob = new Blob([doc], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "markdown-export.html";
    a.click();
    URL.revokeObjectURL(a.href);
    meta.textContent = "已导出 HTML";
  });

  // ---------- 恢复上次内容 ----------
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { editor.value = saved; render(); }
  } catch (e) {}

  render();
})();
</script>
</body>
</html>

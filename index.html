<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown 阅读器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230969da%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237ee787%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2246%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20font-size%3D%2240%22%20font-weight%3D%22800%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3EM%3C%2Ftext%3E%3C%2Fsvg%3E" type="image/svg+xml" />

<!-- 解析与高亮依赖（CDN） -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-light" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-dark" disabled />
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f8fa; --fg: #1f2328; --muted: #656d76;
    --accent: #0969da; --accent-soft: #ddf4ff; --border: #d0d7de;
    --code-bg: #f6f8fa; --code-fg: #1f2328; --quote-border: #d0d7de;
    --quote-fg: #656d76; --table-stripe: #f6f8fa; --shadow: 0 1px 3px rgba(27,31,36,.12);
    --toolbar-bg: rgba(255,255,255,.85); --tab-bg: #f6f8fa; --tab-active: #ffffff;
    --scrollbar-track: transparent; --scrollbar-thumb: #c9cfd4; --scrollbar-thumb-hover: #afb5ba;
  }
  [data-theme="dark"] {
    --bg: #0d1117; --bg-soft: #161b22; --fg: #e6edf3; --muted: #8b949e;
    --accent: #4493f8; --accent-soft: #16305a; --border: #30363d;
    --code-bg: #161b22; --code-fg: #e6edf3; --quote-border: #30363d;
    --quote-fg: #8b949e; --table-stripe: #161b22; --shadow: 0 1px 3px rgba(0,0,0,.5);
    --toolbar-bg: rgba(13,17,23,.85); --tab-bg: #161b22; --tab-active: #0d1117;
    --scrollbar-track: transparent; --scrollbar-thumb: #484f58; --scrollbar-thumb-hover: #6e7681;
  }
  [data-theme="sepia"] {
    --bg: #f7f1e3; --bg-soft: #efe6d3; --fg: #433422; --muted: #8a7a64;
    --accent: #9a5b34; --accent-soft: #ead9c4; --border: #d9cbb0;
    --code-bg: #efe6d3; --code-fg: #433422; --quote-border: #d9cbb0;
    --quote-fg: #8a7a64; --table-stripe: #efe6d3; --shadow: 0 1px 3px rgba(120,90,50,.18);
    --toolbar-bg: rgba(247,241,227,.85); --tab-bg: #efe6d3; --tab-active: #f7f1e3;
    --scrollbar-track: transparent; --scrollbar-thumb: #c4b8a0; --scrollbar-thumb-hover: #b5a88c;
  }

  * { box-sizing: border-box; }

  /* ---------- 全局滚动条（跟随主题） ---------- */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; transition: background .2s; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
  ::-webkit-scrollbar-corner { background: transparent; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
    transition: background .25s, color .25s;
  }

  /* ---------- 顶部工具栏 ---------- */
  .toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--toolbar-bg);
    backdrop-filter: saturate(180%) blur(8px); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar .brand {
    font-weight: 700; font-size: 15px; margin-right: 4px;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .toolbar .brand .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #7ee787);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 800;
  }
  .spacer { flex: 1; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--fg); padding: 6px 12px; border-radius: 8px; font-size: 13px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.danger:hover { border-color: #cf222e; color: #cf222e; }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ---------- 标签栏（多页面切换） ---------- */
  .tabbar {
    flex: 0 0 auto; display: flex; align-items: stretch; gap: 2px;
    padding: 0 8px; background: var(--tab-bg); border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: thin;
  }
  .tabbar::-webkit-scrollbar { height: 6px; }
  .tabbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 9px 10px 9px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; user-select: none; max-width: 220px;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); background: var(--tab-active); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-label { overflow: hidden; text-overflow: ellipsis; }
  .tab-close {
    width: 18px; height: 18px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; font-size: 15px; line-height: 1;
    color: var(--muted); flex: 0 0 auto;
  }
  .tab-close:hover { background: var(--border); color: var(--fg); }

  /* ---------- 主体布局 ---------- */
  .layout { flex: 1 1 auto; display: flex; min-height: 0; }
  .pane-editor {
    width: 42%; min-width: 280px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .pane-preview { flex: 1; overflow: auto; position: relative; min-width: 0; }
  textarea#editor {
    flex: 1; width: 100%; border: 0; resize: none; outline: none;
    padding: 20px; font-family: "SFMono-Regular", Consolas, "Liberation Mono",
      Menlo, monospace; font-size: 14px; line-height: 1.6;
    background: var(--bg-soft); color: var(--fg); tab-size: 2;
  }
  .hidden { display: none !important; }

  /* ---------- 拖拽遮罩 ---------- */
  .drop-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(9,105,218,.12);
    border: 3px dashed var(--accent); display: none; align-items: center;
    justify-content: center; backdrop-filter: blur(2px);
  }
  .drop-overlay.show { display: flex; }
  .drop-overlay .inner {
    background: var(--bg); border: 1px solid var(--border); padding: 28px 40px;
    border-radius: 16px; text-align: center; box-shadow: var(--shadow);
    font-size: 18px; font-weight: 600;
  }

  /* ---------- 空状态 ---------- */
  .welcome {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; color: var(--muted); gap: 10px;
  }
  .welcome h2 { color: var(--fg); margin: 0; font-size: 22px; }
  .welcome .hint { font-size: 14px; line-height: 1.9; max-width: 460px; }
  .welcome kbd {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 5px;
    padding: 1px 7px; font-size: 12px; color: var(--fg);
  }

  /* ---------- Markdown 渲染样式 ---------- */
  .markdown-body { max-width: 820px; margin: 0 auto; padding: 40px 32px 80px; font-size: 16px; line-height: 1.75; word-wrap: break-word; }
  .markdown-body > *:first-child { margin-top: 0; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 1.6em 0 .6em; font-weight: 700; line-height: 1.3; }
  .markdown-body h1 { font-size: 1.9em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body h4 { font-size: 1.05em; }
  .markdown-body p { margin: .9em 0; }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body img { max-width: 100%; border-radius: 8px; }
  .markdown-body ul, .markdown-body ol { padding-left: 1.6em; margin: .8em 0; }
  .markdown-body li { margin: .35em 0; }
  .markdown-body blockquote { margin: 1em 0; padding: .4em 1.1em; color: var(--quote-fg); border-left: 4px solid var(--quote-border); background: var(--bg-soft); border-radius: 0 8px 8px 0; }
  .markdown-body blockquote > *:first-child { margin-top: 0; }
  .markdown-body blockquote > *:last-child { margin-bottom: 0; }
  .markdown-body code { background: var(--code-bg); color: var(--code-fg); padding: .15em .4em; border-radius: 5px; font-size: .88em; font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
  .markdown-body pre { background: var(--code-bg); padding: 16px; border-radius: 10px; overflow: auto; border: 1px solid var(--border); margin: 1em 0; }
  .markdown-body pre code { background: none; padding: 0; font-size: .9em; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .95em; display: block; overflow: auto; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 8px 13px; }
  .markdown-body th { background: var(--bg-soft); font-weight: 700; }
  .markdown-body tr:nth-child(2n) td { background: var(--table-stripe); }
  .markdown-body input[type="checkbox"] { margin-right: 6px; }
  .markdown-body .task-list-item { list-style: none; margin-left: -1.4em; }
  .markdown-body kbd { background: var(--bg-soft); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: .85em; }
  .markdown-body[contenteditable="true"] { outline: 2px dashed var(--accent); outline-offset: -2px; cursor: text; border-radius: 12px; transition: outline-color .2s; }
  .markdown-body[contenteditable="true"]:focus { outline-color: var(--accent); }
  .markdown-body[contenteditable="true"] table,
  .markdown-body[contenteditable="true"] pre { background-color: var(--bg-soft); cursor: default; }

  /* ---------- 选区同步高亮（临时标记） ---------- */
  .sync-hl { background: #ffeb3b !important; color: inherit !important; border-radius: 3px; padding: 0 2px; transition: background .4s ease-out; }
  .sync-hl.fade { background: transparent !important; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .pane-editor { width: 100%; min-width: 0; height: 38%; border-right: 0; border-bottom: 1px solid var(--border); }
    .pane-preview { height: 62%; }
    .meta { display: none; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="brand"><span class="logo">M</span> Markdown 阅读器</div>
    <button class="btn" id="btn-open">打开文件</button>
    <button class="btn primary" id="btn-add">＋ 新增页面</button>
    <button class="btn danger" id="btn-clear">清空</button>
    <button class="btn" id="btn-toggle-editor">隐藏编辑</button>
    <button class="btn" id="btn-edit-preview">✏️ 编辑</button>
    <button class="btn" id="btn-theme">🌗 主题</button>
    <button class="btn" id="btn-copy">复制 MD</button>
    <button class="btn" id="btn-export-md">导出 MD</button>
    <button class="btn" id="btn-export">导出 HTML</button>
    <div class="spacer"></div>
    <span class="meta" id="meta">就绪</span>
    <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" class="hidden" />
  </div>

  <div class="tabbar" id="tabbar"></div>

  <div class="layout">
    <div class="pane-editor" id="pane-editor">
      <textarea id="editor" placeholder="在此粘贴 Markdown 文字，或把 .md 文件拖进来…" spellcheck="false"></textarea>
    </div>
    <div class="pane-preview" id="pane-preview">
      <div class="welcome" id="welcome">
        <h2>把 Markdown 变成好读的文章 ✨</h2>
        <div class="hint">
          • <b>拖拽</b> 一个 <code>.md</code> / <code>.txt</code> 文件到这里<br/>
          • 直接 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 Markdown 文字<br/>
          • 点击「打开文件」或「＋ 新增页面」<br/>
          • 已有内容时再拖入文件 = 自动新增一页<br/>
          • 顶部标签可随时切换 / 关闭多个页面<br/>
          • 点「✏️ 编辑」可直接在右侧显示页里修改内容<br/>
          • 左右两侧选中文字会自动同步高亮对应内容
        </div>
      </div>
      <article class="markdown-body" id="preview"></article>
    </div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
    <div class="inner">📄 松开以加载（已有内容将自动新增一页）</div>
  </div>

<script>
(function () {
  "use strict";

  const editor = document.getElementById("editor");
  const preview = document.getElementById("preview");
  const welcome = document.getElementById("welcome");
  const meta = document.getElementById("meta");
  const fileInput = document.getElementById("file-input");
  const dropOverlay = document.getElementById("drop-overlay");
  const paneEditor = document.getElementById("pane-editor");
  const tabbar = document.getElementById("tabbar");
  const STORAGE_KEY = "md-reader-pages";

  marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });

  // ---------- 主题 ----------
  const themes = ["light", "dark", "sepia"];
  const hljsLight = document.getElementById("hljs-light");
  const hljsDark = document.getElementById("hljs-dark");
  let currentTheme = "light";
  function applyTheme(theme) {
    currentTheme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    const isDark = theme === "dark";
    hljsDark.disabled = !isDark; hljsLight.disabled = isDark;
    try { localStorage.setItem("md-reader-theme", theme); } catch (e) {}
  }
  applyTheme((function () { try { return localStorage.getItem("md-reader-theme"); } catch (e) { return null; } })() || "light");
  let themeIdx = themes.indexOf(document.documentElement.getAttribute("data-theme"));
  document.getElementById("btn-theme").addEventListener("click", function () {
    themeIdx = (themeIdx + 1) % themes.length; applyTheme(themes[themeIdx]);
  });

  // ---------- 多页面状态 ----------
  let pages = [];   // { id, title(手动), filename, content }
  let activeId = null;

  function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function newPage(filename, content) {
    return { id: uid(), title: "", filename: filename || "", content: content || "" };
  }
  function activePage() { return pages.find(function (p) { return p.id === activeId; }) || pages[0]; }
  function displayTitle(p, i) {
    if (p.title) return p.title;
    if (p.filename) return p.filename.replace(/\.(md|markdown|txt)$/i, "");
    const m = p.content.match(/^\s*#\s+(.+)$/m);
    if (m) return m[1].trim().slice(0, 32);
    return "页面 " + (i + 1);
  }

  // ---------- 渲染预览 ----------
  function renderPreview() {
    const raw = editor.value;
    if (raw.trim() === "") {
      preview.innerHTML = ""; welcome.classList.toggle("hidden", editMode); meta.textContent = "就绪"; return;
    }
    welcome.classList.add("hidden");
    preview.innerHTML = DOMPurify.sanitize(marked.parse(raw));
    preview.querySelectorAll("pre code").forEach(function (b) { try { hljs.highlightElement(b); } catch (e) {} });
    if (editMode) relock();
    const chars = raw.replace(/\s/g, "").length;
    const words = (raw.match(/[一-龥]/g) || []).length + (raw.trim().split(/\s+/).filter(Boolean).length);
    meta.textContent = chars + " 字符 · 约 " + Math.max(1, Math.round(words / 300)) + " 分钟阅读";
  }

  // ---------- 标签栏 ----------
  function renderTabs() {
    tabbar.innerHTML = "";
    pages.forEach(function (p, i) {
      const tab = document.createElement("div");
      tab.className = "tab" + (p.id === activeId ? " active" : "");
      const label = document.createElement("span");
      label.className = "tab-label"; label.textContent = displayTitle(p, i); label.title = label.textContent;
      const close = document.createElement("span");
      close.className = "tab-close"; close.textContent = "×"; close.title = "关闭此页面";
      close.addEventListener("click", function (e) { e.stopPropagation(); closePage(p.id); });
      label.addEventListener("dblclick", function (e) {
        e.stopPropagation();
        const name = prompt("重命名此页面：", displayTitle(p, i));
        if (name !== null) { p.title = name.trim(); renderTabs(); persist(); }
      });
      tab.appendChild(label); tab.appendChild(close);
      tab.addEventListener("click", function () { switchPage(p.id); });
      tabbar.appendChild(tab);
    });
  }

  function switchPage(id) {
    const cur = activePage();
    if (cur) { cur.content = editMode ? htmlToMarkdown(preview) : editor.value; }
    activeId = id;
    editor.value = activePage().content;
    renderPreview(); renderTabs(); persist();
  }

  function closePage(id) {
    if (editMode && id === activeId) { const c = activePage(); if (c) c.content = htmlToMarkdown(preview); }
    const idx = pages.findIndex(function (p) { return p.id === id; });
    if (idx < 0) return;
    pages.splice(idx, 1);
    if (pages.length === 0) { const np = newPage(); pages.push(np); activeId = np.id; }
    else if (id === activeId) { activeId = pages[Math.min(idx, pages.length - 1)].id; }
    editor.value = activePage().content;
    renderPreview(); renderTabs(); persist();
  }

  function addPage() {
    const cur = activePage(); if (cur) cur.content = editor.value;
    const p = newPage(); pages.push(p); activeId = p.id;
    editor.value = ""; renderPreview(); renderTabs(); persist();
    editor.focus();
  }

  // ---------- 持久化 ----------
  function persist() {
    const cur = activePage(); if (cur) cur.content = editor.value;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ pages: pages, activeId: activeId })); } catch (e) {}
  }
  function restore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d.pages && d.pages.length) {
          pages = d.pages;
          activeId = (d.activeId && pages.some(function (p) { return p.id === d.activeId; })) ? d.activeId : pages[0].id;
          return true;
        }
      }
    } catch (e) {}
    return false;
  }

  // ---------- 编辑器输入（防抖） ----------
  let t;
  let editMode = false;   // 右侧预览区是否处于「直接编辑」状态
  let editT;
  editor.addEventListener("input", function () {
    clearTimeout(t);
    t = setTimeout(function () {
      const p = activePage(); if (p) p.content = editor.value;
      renderPreview(); renderTabs(); persist();
    }, 200);
  });

  // ---------- 文件读取 ----------
  function loadContentInto(text, filename) {
    const cur = activePage();
    // 已有内容 → 自动新增一页；否则载入当前页
    if (cur && cur.content.trim() !== "") {
      const p = newPage(filename, text); pages.push(p); activeId = p.id;
    } else {
      cur.content = text; cur.filename = filename || "";
    }
    editor.value = activePage().content;
    renderPreview(); renderTabs(); persist();
    if (filename) meta.textContent = "已加载：" + filename;
  }
  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) { loadContentInto(String(e.target.result), file.name); };
    reader.readAsText(file);
  }
  document.getElementById("btn-open").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });

  // ---------- 拖拽 ----------
  let dragDepth = 0;
  window.addEventListener("dragenter", function (e) { e.preventDefault(); dragDepth++; dropOverlay.classList.add("show"); });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function (e) { e.preventDefault(); dragDepth--; if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove("show"); } });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; dropOverlay.classList.remove("show");
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) { loadFile(file); return; }
    const text = e.dataTransfer.getData("text/plain");

  function escapeHtml(s) {

  document.getElementById("btn-export-md").addEventListener("click", function () {

  // ---------- 显示页直接编辑 ----------
  // 把渲染后的 DOM 还原为 Markdown（支持常用元素：标题/段落/粗斜体/行内代码/代码块/引用/列表/任务列表/链接/图片/分割线/表格）
  function htmlToMarkdown(root) {
    function inline(node) {
      let out = "";
      node.childNodes.forEach(function (n) {
        if (n.nodeType === 3) { out += n.textContent; return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName.toLowerCase();
        const txt = inline(n);
        if (tag === "strong" || tag === "b") out += "**" + txt + "**";
        else if (tag === "em" || tag === "i") out += "*" + txt + "*";
        else if (tag === "code") out += "`" + n.textContent + "`";
        else if (tag === "a") out += "[" + txt + "](" + (n.getAttribute("href") || "") + ")";
        else if (tag === "img") out += "![" + (n.getAttribute("alt") || "") + "](" + (n.getAttribute("src") || "") + ")";
        else if (tag === "br") out += "\n";
        else out += txt;
      });
      return out;
    }
    function liBody(li, depth) {
      let out = "";
      li.childNodes.forEach(function (n) {
        if (n.nodeType === 1) {
          const t = n.tagName.toLowerCase();
          if (t === "input") return;
          if (t === "ul" || t === "ol") out += "\n" + block(n, depth);
          else out += inline(n);
        } else if (n.nodeType === 3) { out += n.textContent; }
      });
      return out.replace(/\n{2,}/g, "\n").trim();
    }
    function tableToMd(table) {
      const rows = table.querySelectorAll("tr");
      if (!rows.length) return "";
      let md = "";
      rows.forEach(function (tr, ri) {
        const cells = tr.querySelectorAll("th, td");
        const line = Array.prototype.map.call(cells, function (c) { return inline(c).trim().replace(/\|/g, "\\|"); }).join(" | ");
        md += "| " + line + " |\n";
        if (ri === 0) {
          const sep = Array.prototype.map.call(cells, function () { return "---"; }).join(" | ");
          md += "| " + sep + " |\n";
        }
      });
      return md;
    }
    function block(node, depth) {
      let md = "";
      const pad = "  ".repeat(depth);
      node.childNodes.forEach(function (n) {
        if (n.nodeType === 3) {
          const t = n.textContent.replace(/^\n+|\n+$/g, "");
          if (t.trim() !== "") md += t + "\n\n";
          return;
        }
        if (n.nodeType !== 1) return;
        const tag = n.tagName.toLowerCase();
        if (tag === "h1" || tag === "h2" || tag === "h3" || tag === "h4" || tag === "h5" || tag === "h6") {
          const lvl = parseInt(tag[1], 10);
          md += "#".repeat(lvl) + " " + inline(n).trim() + "\n\n";
        } else if (tag === "p") {
          md += inline(n).trim() + "\n\n";
        } else if (tag === "blockquote") {
          const inner = block(n, 0).replace(/\n+$/, "");
          md += inner.split("\n").map(function (l) { return "> " + l; }).join("\n") + "\n\n";
        } else if (tag === "pre") {
          const code = n.querySelector("code");
          const cls = code ? code.className : "";
          const m = cls && cls.match(/language-([\w-]+)/);
          const lang = m ? m[1] : "";
          md += "```" + lang + "\n" + (code ? code.textContent : n.textContent) + "\n```\n\n";
        } else if (tag === "hr") {
          md += "---\n\n";
        } else if (tag === "ul" || tag === "ol") {
          let idx = 1;
          n.childNodes.forEach(function (li) {
            if (li.nodeType !== 1 || li.tagName.toLowerCase() !== "li") return;
            const cb = li.querySelector("input[type=checkbox]");
            const isTask = !!cb;
            const marker = tag === "ol" ? (idx++) + "." : "-";
            const firstPrefix = isTask ? pad + "- [" + (cb.checked ? "x" : " ") + "] " : pad + marker + " ";
            const lines = liBody(li, depth + 1).split("\n");
            md += firstPrefix + (lines[0] || "").trim() + "\n";
            for (let k = 1; k < lines.length; k++) md += pad + "  " + lines[k] + "\n";
          });
          md += "\n";
        } else if (tag === "table") {
          md += tableToMd(n) + "\n\n";
        } else if (tag === "div") {
          md += block(n, depth);
        } else {
          md += inline(n).trim() + "\n\n";
        }
      });
      return md;
    }
    return block(root, 0).replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }

  const btnEditPreview = document.getElementById("btn-edit-preview");
  // 锁定易损坏的复杂结构（表格 / 代码块），避免编辑模式里结构被破坏

  preview.addEventListener("input", function () {
    if (!editMode) return;

  // ---------- 选区同步（左源码 → 右预览高亮，右预览 → 左源码选中） ----------
  let selTimer, hlTimer;

  function clearHl() {
    var hls = preview.querySelectorAll(".sync-hl");
    for (var i = hls.length - 1; i >= 0; i--) {
      var el = hls[i], parent = el.parentNode;
      while (el.firstChild) parent.insertBefore(el.firstChild, el);
      parent.removeChild(el);
    }
  }

  // 去掉 Markdown 格式标记，得到纯显示文本（用于匹配）
  function stripMd(s) {
    return s
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
      .replace(/`[^`\n]+`/g, function(m){return m.slice(1,-1);})
      .replace(/```[\w-]*\n?[\s\S]*?```/g, function(m){return m.replace(/```[^\n]*/g,"").trim();})
      .replace(/\*\*[^*]+\*\*/g, function(m){return m.slice(2,-2);})
      .replace(/__[^_]+__/g, function(m){return m.slice(2,-2);})
      .replace(/\*([^*]+)\*/g, "$1")
      .replace(/_([^_]+)_/g, "$1")
      .replace(/~~[^~]+~~/g, function(m){return m.slice(2,-2);})
      .replace(/^#{1,6}\s+/gm, "")
      .replace(/^[\s]*[-*+]\s+\[[ xX]\]\s+/gm, "")
      .replace(/^[\s]*[-*+]\s+/gm, "")
      .replace(/^\d+\.\s+/gm, "")
      .replace(/^[\s]*>\s*/gm, "")
      .replace(/^\|?\s*[:\-]+\|([:\-\|]+)*\|?\s*$/gm, "")
      .replace(/\|/g, " ")
      .replace(/<[^>]+>/g, "")
      .replace(/\\([*_`~>#\[\]()!|\\{}])/g, "$1")
      .replace(/[ \t]+/g, " ")
      .replace(/\n/g, " ")
      .trim();
  }

  // 在 root 的文本节点拼接文本中查找 needle
  function findInTextNodes(root, needle) {
    if (!needle || needle.length < 1) return null;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n, full = "";
    while ((n = walker.nextNode())) {
      nodes.push({ node: n, start: full.length });
      full += n.textContent;
    }
    nodes.forEach(function(m, i) { m.end = (i + 1 < nodes.length ? nodes[i + 1].start : full.length); });

    var idx = full.indexOf(needle);
    if (idx >= 0) return { idx: idx, end: idx + needle.length, nodes: nodes };

    var lowerFull = full.toLowerCase(), lowerNeedle = needle.toLowerCase();
    idx = lowerFull.indexOf(lowerNeedle);
    if (idx >= 0) return { idx: idx, end: idx + lowerNeedle.length, nodes: nodes };

    var normFull = full.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
    var normNeedle = needle.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
    idx = normFull.indexOf(normNeedle);
    if (idx >= 0) return { idx: idx, end: idx + normNeedle.length, nodes: nodes };

    return null;
  }

  function makeRange(posInfo) {
    if (!posInfo) return null;
    var nodes = posInfo.nodes;
    function atPos(p) {
      for (var i = 0; i < nodes.length; i++) {
        if (p <= nodes[i].end) return { node: nodes[i].node, off: p - nodes[i].start };
      }
      var last = nodes[nodes.length - 1];
      return { node: last.node, off: last.node.textContent.length };
    }
    var s = atPos(posInfo.idx), e = atPos(posInfo.end);
    var r = document.createRange();
    r.setStart(s.node, s.off); r.setEnd(e.node, e.off);
    return r;
  }

  function highlightRangeFragments(range) {
    var startC = range.startContainer, startO = range.startOffset;
    var endC = range.endContainer, endO = range.endOffset;
    var ca = range.commonAncestorContainer;
    var root = (ca.nodeType === 3) ? ca.parentNode : ca;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var inRange = false, node;
    var fragments = [];
    while ((node = walker.nextNode())) {
      if (!inRange && node === startC) inRange = true;
      if (inRange) {
        var s = (node === startC) ? startO : 0;
        var e = (node === endC) ? endO : node.textContent.length;
        if (e > s) fragments.push({ node: node, start: s, end: e });
      }
      if (node === endC) break;
    }
    for (var i = fragments.length - 1; i >= 0; i--) {
      var f = fragments[i];
      var r2 = document.createRange();
      r2.setStart(f.node, f.start); r2.setEnd(f.node, f.end);
      var sp = document.createElement("span");
      sp.className = "sync-hl";
      r2.surroundContents(sp);
    }
    var firstHl = preview.querySelector(".sync-hl");
    if (firstHl) firstHl.scrollIntoView({ block: "center", behavior: "smooth" });
    clearTimeout(hlTimer);
    hlTimer = setTimeout(function () {
      var spans = preview.querySelectorAll(".sync-hl");
      for (var i = 0; i < spans.length; i++) {
        spans[i].style.background = "transparent";
        spans[i].style.transition = "background .5s ease";
      }
      setTimeout(clearHl, 500);
    }, 2500);
  }

  function highlightInPreview(needle) {
    clearHl();
    if (!needle || !needle.trim()) return false;

    var cands = [
      needle,
      needle.trim(),
      needle.replace(/[ \t\n]+/g, " ").trim(),
      stripMd(needle)
    ].filter(function(s, i, arr){ return s && s.length >= 2 && arr.indexOf(s) === i; });

    if (needle.length > 12) {
      cands.push(needle.slice(Math.floor(needle.length * 0.2), Math.ceil(needle.length * 0.8)));
      cands.push(stripMd(needle).slice(Math.floor(stripMd(needle).length * 0.2), Math.ceil(stripMd(needle).length * 0.8)));
    }

    var pos = null;
    for (var ci = 0; ci < cands.length; ci++) {
      pos = findInTextNodes(preview, cands[ci]);
      if (pos) break;
    }
    if (!pos) return false;

    var range = makeRange(pos);
    if (!range) return false;

    try {
      var hl = document.createElement("span");
      hl.className = "sync-hl";
      range.surroundContents(hl);
      hl.scrollIntoView({ block: "center", behavior: "smooth" });
      clearTimeout(hlTimer);
      hlTimer = setTimeout(function () {
        var spans = preview.querySelectorAll(".sync-hl");
        for (var i = 0; i < spans.length; i++) {
          spans[i].style.background = "transparent";
          spans[i].style.transition = "background .5s ease";
        }
        setTimeout(clearHl, 500);
      }, 2500);
      return true;
    } catch (e) {
      try { highlightRangeFragments(range); return true; }
      catch (e2) {
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        range.startContainer.parentElement.scrollIntoView({ block: "center", behavior: "smooth" });
        return true;
      }
    }
  }

  function selectInEditor(needle) {
    if (!needle || !needle.trim()) return false;
    var src = editor.value;
    var cands = [needle, needle.trim(), stripMd(needle).trim()];
    if (needle.length > 12) cands.push(needle.slice(Math.floor(needle.length * 0.2), Math.ceil(needle.length * 0.8)));
    for (var ci = 0; ci < cands.length; ci++) {
      var c = cands[ci]; if (!c || c.length < 2) continue;
      var s = src.indexOf(c);
      if (s >= 0) {
        editor.focus();
        editor.setSelectionRange(s, s + c.length);
        var linesBefore = src.substring(0, s).split("\n").length;
        var lineHeight = parseInt(getComputedStyle(editor).lineHeight) || 22;
        editor.scrollTop = Math.max(0, linesBefore * lineHeight - editor.clientHeight / 2);
        return true;
      }
    }
    return false;
  }

  // Editor → Preview：用 mouseup + keyup 直接读取 textarea 选区（selectionchange 在 textarea 上不可靠）
  function syncEditorToPreview() {
    var start = editor.selectionStart, end = editor.selectionEnd;
    if (start === end) return;
    var text = editor.value.substring(start, end);
    if (!text || text.length < 2) return;
    clearTimeout(selTimer);
    selTimer = setTimeout(function () { highlightInPreview(text); }, 60);
  }
  editor.addEventListener("mouseup", syncEditorToPreview);
  editor.addEventListener("keyup", function (e) {
    if (e.shiftKey && /^(Arrow|Home|End|Page)/.test(e.key)) syncEditorToPreview();
  });
  editor.addEventListener("click", function () { clearTimeout(selTimer); clearHl(); });

  // Preview → Editor：用 selectionchange（普通 DOM 行为稳定）
  var syncingFromPreview = false;
  document.addEventListener("selectionchange", function () {
    if (syncingFromPreview) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    var anc = sel.anchorNode; if (!anc) return;
    if (!preview.contains(anc)) return;
    var text = sel.toString();
    if (!text || text.length < 2) return;
    clearTimeout(selTimer);
    selTimer = setTimeout(function () {
      syncingFromPreview = true;
      selectInEditor(text);
      setTimeout(function () { syncingFromPreview = false; }, 50);
    }, 60);
  });

  // ---------- 启动 ----------
  if (!restore()) { pages = [newPage()]; activeId = pages[0].id; }
  editor.value = activePage().content;
  renderPreview(); renderTabs();
})();
</script>
</body>
</html>
